name: Restrict existing Play candidate downloads
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-play-candidates
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preserve private copies before removing public Play assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/archive_play_assets.py
