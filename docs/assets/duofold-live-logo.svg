<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Duo Fold Live</title>
  <desc id="desc">Mint and periwinkle fold mark on a navy to violet background. Made for the fold. Make every fold feel fluid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#263d5b"/><stop offset="1" stop-color="#252139"/>
    </linearGradient>
    <linearGradient id="panel" gradientUnits="userSpaceOnUse" x1="192" y1="192" x2="832" y2="832">
      <stop stop-color="#a7dfd1"/><stop offset="1" stop-color="#b4c8ff"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="360" rx="40" fill="url(#background)"/>
  <g transform="translate(20 30) scale(.293)">
    <rect x="224" y="268.8" width="256" height="486.4" rx="51.2" fill="none" stroke="#b4c8ff" stroke-width="29.09"/>
    <rect x="544" y="268.8" width="256" height="486.4" rx="51.2" fill="url(#panel)"/>
  </g>
  <g font-family="Roboto, Arial, Helvetica, sans-serif">
    <text x="340" y="100" font-size="20" font-weight="500" letter-spacing="3" fill="#a7dfd1">MADE FOR THE FOLD</text>
    <text x="336" y="205" font-size="88" font-weight="600" letter-spacing="-2.6" fill="#f1f3fa">Duo Fold Live</text>
    <text x="340" y="268" font-size="30" font-weight="400" fill="#b5bfd1">Make every fold feel fluid.</text>
  </g>
</svg>
